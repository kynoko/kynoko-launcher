# Every push and pull request: the Rust tests and a full build on the three
# desktop systems. No secrets are used anywhere (public repository).
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-22.04
            bundles: deb,appimage,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: app
        run: npm ci

      - name: Rust tests
        working-directory: app
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        working-directory: app
        run: npx tauri build --bundles ${{ matrix.bundles }}
