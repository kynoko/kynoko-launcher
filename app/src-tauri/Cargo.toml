[package]
name = "kynoko-launcher"
version = "0.1.0"
description = "Kynoko Launcher: installs the Kynoko web apps, opens your files in them, saves back in place"
authors = ["Kynoko"]
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "kynoko_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
getrandom = "0.2"
dirs = "5"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
image = { version = "0.25", default-features = false, features = ["png"] }
fontdb = "0.24.0"
# The system's "Save as" dialog (MIT). Linux: through the XDG desktop portal,
# loaded at run time; nothing to install to build.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_RestartManager", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
mslnk = "0.1"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
core-foundation = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
