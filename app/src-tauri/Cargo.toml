[package]
name = "kynoko-launcher"
version = "0.1.0"
description = "Kynoko Launcher: installs the Kynoko web apps, opens your files in them, saves back in place"
authors = ["Kynoko"]
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "kynoko_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
getrandom = "0.2"
dirs = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
